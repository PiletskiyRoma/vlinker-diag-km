name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Initialize Buildozer spec
      run: |
        buildozer init
        sed -i 's/#title = My Application/title = VLinker Diag/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = vlinkerdiag/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.vlinker/' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,pyserial/' buildozer.spec
        sed -i 's/#android.permissions =/android.permissions = INTERNET, BLUETOOTH, BLUETOOTH_ADMIN, BLUETOOTH_CONNECT, ACCESS_FINE_LOCATION/' buildozer.spec
        sed -i 's/#orientation = portrait/orientation = portrait/' buildozer.spec

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
